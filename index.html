<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
:root{
  --bg:#ECEEE7; --surface:#F8F8F3; --surface-2:#E3E6DC;
  --ink:#22261F; --muted:#666B5C; --line:#D5D8CA;
  --accent:#6B2E4D; --accent-ink:#fff;
  --sabor-fg:#38562F; --sabor-bg:#DFE8D5;
  --grasa-fg:#7E540A; --grasa-bg:#F0E4C6;
  --cocc-fg:#8B3446; --cocc-bg:#F2DCDF;
  --final-fg:#1B575E; --final-bg:#D6E7E7;
  --wheel-paper:#ECEEE7; --wheel-ink:#2E2B22; --wheel-ink-soft:#8A8472;
  --wheel-hub:#ECEEE7; --wheel-hub-line:var(--line);
  --radius:10px;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15170F; --surface:#1D2019; --surface-2:#272B21;
    --ink:#E9EADF; --muted:#9DA292; --line:#333829;
    --accent:#E39CBE; --accent-ink:#24101B;
    --sabor-fg:#AECC9D; --sabor-bg:#26321F;
    --grasa-fg:#E2B75F; --grasa-bg:#342A14;
    --cocc-fg:#EA9CA9; --cocc-bg:#351D23;
    --final-fg:#8AC8CD; --final-bg:#16302F;
    --wheel-paper:#15170F; --wheel-ink:#EDEADE; --wheel-ink-soft:#8C9280;
    --wheel-hub:#15170F; --wheel-hub-line:var(--line);
  }
}
:root[data-theme="dark"]{
  --bg:#15170F; --surface:#1D2019; --surface-2:#272B21;
  --ink:#E9EADF; --muted:#9DA292; --line:#333829;
  --accent:#E39CBE; --accent-ink:#24101B;
  --sabor-fg:#AECC9D; --sabor-bg:#26321F;
  --grasa-fg:#E2B75F; --grasa-bg:#342A14;
  --cocc-fg:#EA9CA9; --cocc-bg:#351D23;
  --final-fg:#8AC8CD; --final-bg:#16302F;
  --wheel-paper:#15170F; --wheel-ink:#EDEADE; --wheel-ink-soft:#8C9280;
  --wheel-hub:#15170F; --wheel-hub-line:var(--line);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%}
.wrap{max-width:880px;margin:0 auto;padding-inline:20px;padding-block:0 56px}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.015em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* --- cabecera --- */
.masthead{padding-block:26px 20px;display:flex;align-items:center;gap:12px}
#theme{margin-left:auto;flex:none;width:36px;height:36px;display:inline-flex;align-items:center;
  justify-content:center;border:1px solid var(--line);border-radius:9px;background:transparent;
  color:var(--muted);cursor:pointer}
#theme:hover{background:var(--surface-2);color:var(--ink)}
#theme svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.wordmark{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.03em;
  text-decoration:none;line-height:1;font-variation-settings:"SOFT" 30}
.wordmark em{font-style:italic;color:var(--accent)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--radius);
  padding:4px;gap:4px;margin-bottom:22px}
.tabs a{text-align:center;padding:7px 10px;border-radius:7px;text-decoration:none;font-size:14px;
  font-weight:600;color:var(--muted);transition:background .15s,color .15s}
.tabs a[aria-selected="true"]{background:var(--surface-2);color:var(--ink)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.subtabs a{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;text-decoration:none;
  border:1px solid var(--line);color:var(--muted)}
.subtabs a[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}

/* --- buscador --- */
.searchbar{display:flex;gap:8px;align-items:stretch}
.searchbar label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#search{flex:1;min-width:0;font:inherit;font-size:17px;padding:12px 14px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface);color:var(--ink)}
#search::placeholder{color:var(--muted)}
.btn{font:inherit;font-size:14px;font-weight:600;padding:0 16px;border-radius:var(--radius);
  border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--surface-2)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.filters button{font:inherit;font-size:12px;font-weight:600;letter-spacing:.03em;padding:5px 11px;
  border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}
.filters button[aria-pressed="true"]{border-color:currentColor}
.filters button.f-sabor[aria-pressed="true"]{background:var(--sabor-bg);color:var(--sabor-fg)}
.filters button.f-grasa[aria-pressed="true"]{background:var(--grasa-bg);color:var(--grasa-fg)}
.filters button.f-cocc[aria-pressed="true"]{background:var(--cocc-bg);color:var(--cocc-fg)}
.filters button.f-final[aria-pressed="true"]{background:var(--final-bg);color:var(--final-fg)}
.count{margin:16px 0 8px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600;font-variant-numeric:tabular-nums}

/* --- tabla --- */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;background:var(--surface)}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th:first-child,td:first-child{width:24%;min-width:150px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
td.regions{font-size:14px;color:var(--muted);line-height:1.65}
td.regions a{color:inherit;text-decoration:none;font-weight:400}
td.regions a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
td.regions .sep{opacity:.45}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td a{text-decoration:none;font-weight:500}
td a:hover{text-decoration:underline;text-underline-offset:2px}
.empty{padding:36px 14px;text-align:center;color:var(--muted);font-size:15px}

/* --- etiquetas de categoría --- */
.tag{display:inline-block;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:3px 9px;
  border-radius:5px;white-space:nowrap}
.t-sabor{background:var(--sabor-bg);color:var(--sabor-fg)}
.t-grasa{background:var(--grasa-bg);color:var(--grasa-fg)}
.t-cocc{background:var(--cocc-bg);color:var(--cocc-fg)}
.t-final{background:var(--final-bg);color:var(--final-fg)}

/* --- explorar --- */
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.crumbs span{margin:0 6px;opacity:.5}
.page-title{font-size:30px;margin-bottom:22px}
.sub{color:var(--muted);font-size:14px;margin:0 0 22px}
.sub a{color:var(--accent)}

details.cat{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  margin-bottom:10px;overflow:hidden}
details.cat > summary{cursor:pointer;list-style:none;padding:14px 16px;display:flex;align-items:baseline;
  gap:10px;font-family:var(--display);font-weight:700;font-size:19px}
details.cat > summary::-webkit-details-marker{display:none}
details.cat > summary::after{content:"+";margin-left:auto;font-family:var(--sans);font-weight:400;
  font-size:20px;color:var(--muted)}
details.cat[open] > summary::after{content:"–"}
details.cat > summary .n{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--muted);
  font-variant-numeric:tabular-nums}
.catbody{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px}
.regblock h4{margin:0 0 6px;font-family:var(--sans);font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--muted);font-weight:600}
.regblock h4 a{text-decoration:none}
.inline-list{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:14px;text-decoration:none;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.pill:hover{background:var(--surface-2)}

.alpha{display:flex;flex-direction:column;gap:18px}
.alpha-group{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.alpha-letter{font-family:var(--display);font-size:24px;font-weight:700;color:var(--accent);line-height:1.1}
.linklist{columns:2;column-gap:24px}
.linklist a{display:block;text-decoration:none;padding:3px 0;break-inside:avoid;font-size:15px}
.linklist a:hover{text-decoration:underline;text-underline-offset:2px}

.regiongrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.regiongrid a{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
  padding:11px 14px;text-decoration:none;font-weight:500}
.regiongrid a:hover{background:var(--surface-2)}
.regiongrid .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* --- fichas --- */
.group{margin-bottom:24px}
.group-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;
  padding-bottom:6px;border-bottom:1px solid var(--line)}
.group-head h3{font-size:17px}
.group-head .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:auto}
.pairs{display:flex;flex-direction:column;gap:2px}
.pair{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:7px 12px;border-radius:8px;
  text-decoration:none;background:var(--surface);border:1px solid var(--line)}
.pair:hover{background:var(--surface-2)}
.pair .name{font-weight:500}
.pair .tag{margin-left:auto}
.mates{display:flex;flex-direction:column;gap:6px}
.mate{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px}
.mate-top{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
.mate-name{font-weight:500;text-decoration:none}
.mate-name:hover{text-decoration:underline;text-underline-offset:2px}
.mate-regs{margin:5px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.mate-regs a{color:inherit;text-decoration:none}
.mate-regs a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.mate-regs .sep{opacity:.45}



/* --- ruedas --- */
body{overflow-x:hidden}
.bleed{position:relative;left:50%;transform:translateX(-50%);width:100vw;padding-inline:16px}
.wheelbox{overflow-x:auto;max-width:1128px;margin:0 auto;}
.wheelbox svg{display:block;margin:0 auto}
.wheelbox path{stroke:var(--wheel-paper);stroke-width:.7;stroke-linejoin:round}
.ring-reg path{stroke-width:1.6}
.ring-cont path{stroke-width:2.4}
.wheelbox a{cursor:pointer}
.wheelbox a:hover path{stroke:var(--wheel-ink);stroke-width:1.4}
.ring-reg a:hover path,.ring-cont a:hover path{stroke-width:2.4}
.wheelbox text{font-family:var(--sans);fill:var(--wheel-ink);pointer-events:none}
.lbl-reg{font-weight:600}
.lbl-cont{font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.lbl-hub{font-family:var(--display);font-weight:700}
.lbl-hub-n{fill:var(--wheel-ink-soft)}
.hub{fill:var(--wheel-hub);stroke:var(--wheel-hub-line);stroke-width:1.5}
.wheel-hint{max-width:1128px;margin:8px auto 0;font-size:12px;color:var(--muted);text-align:center}
@media (min-width:1180px){.wheel-hint{display:none}}
@media (max-width:560px){
  .wordmark{font-size:25px}
  .page-title{font-size:25px}
  .linklist{columns:1}
  .alpha-group{grid-template-columns:26px 1fr;gap:8px}
  td,th{padding-inline:10px}
  table{font-size:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const byFood = new Map(), byRegion = new Map();
for (const r of ROWS) {
  if (!byFood.has(r.foodSlug)) byFood.set(r.foodSlug, {name:r.food, rows:[]});
  byFood.get(r.foodSlug).rows.push(r);
  if (!byRegion.has(r.regionSlug)) byRegion.set(r.regionSlug, {name:r.region, rows:[]});
  byRegion.get(r.regionSlug).rows.push(r);
}
const col = new Intl.Collator("es");
const foodList = [...byFood.entries()].sort((a,b) => col.compare(a[1].name, b[1].name));
const regionList = [...byRegion.entries()].sort((a,b) => col.compare(a[1].name, b[1].name));

const tag = c => `<span class="tag t-${CAT_CLS[c]}">${c}</span>`;
const plural = (n, one, many) => `${n} ${n===1?one:many}`;

/* ---------- estado del buscador ---------- */
let query = "";
let activeCats = new Set();

function matches(r) {
  if (activeCats.size && !activeCats.has(r.cat)) return false;
  if (!query) return true;
  return fold(query).split(/\s+/).filter(Boolean).every(t => r.hay.includes(t));
}

function renderResults() {
  const groups = new Map();
  for (const r of ROWS) {
    if (!matches(r)) continue;
    if (!groups.has(r.foodSlug)) groups.set(r.foodSlug, {name:r.food, slug:r.foodSlug, cats:[], regions:[]});
    const g = groups.get(r.foodSlug);
    if (!g.cats.includes(r.cat)) g.cats.push(r.cat);
    g.regions.push(r);
  }
  const hits = [...groups.values()].sort((a,b) => col.compare(a.name, b.name));
  document.getElementById("count").textContent =
    plural(hits.length, "ingrediente", "ingredientes");
  const box = document.getElementById("results");
  if (!hits.length) {
    box.innerHTML = `<p class="empty">Ningún ingrediente coincide con esa búsqueda.</p>`;
    return;
  }
  box.innerHTML = `<table>
    <thead><tr><th>Ingrediente</th><th>Categoría</th><th>Regiones</th></tr></thead>
    <tbody>${hits.map(g => `<tr>
      <td><a href="#/ingrediente/${g.slug}">${esc(g.name)}</a></td>
      <td><span class="tags">${g.cats.sort((a,b) => CAT_ORDER[a]-CAT_ORDER[b]).map(tag).join("")}</span></td>
      <td class="regions">${g.regions.sort((a,b) => col.compare(a.region,b.region))
        .map(r => `<a href="#/region/${r.regionSlug}">${esc(r.region)}</a>`)
        .join(`<span class="sep"> · </span>`)}</td>
    </tr>`).join("")}</tbody></table>`;
}

function viewSearch() {
  return `<div class="searchbar">
      <label for="search">Buscar</label>
      <input id="search" type="search" autocomplete="off" placeholder="Busca un ingrediente, una categoría o una región" value="${esc(query)}">
      <button class="btn" id="clear" type="button">Limpiar</button>
    </div>
    <div class="filters" id="filters">${CATS.map(c =>
      `<button type="button" class="f-${c.cls}" data-cat="${c.name}" aria-pressed="${activeCats.has(c.name)}">${c.name}</button>`
    ).join("")}</div>
    <p class="count" id="count"></p>
    <div class="tablebox" id="results"></div>`;
}

function wireSearch() {
  const input = document.getElementById("search");
  input.addEventListener("input", () => { query = input.value; renderResults(); });
  document.getElementById("clear").addEventListener("click", () => {
    query = ""; input.value = ""; activeCats.clear();
    document.querySelectorAll("#filters button").forEach(b => b.setAttribute("aria-pressed","false"));
    input.focus(); renderResults();
  });
  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    const c = b.dataset.cat;
    activeCats.has(c) ? activeCats.delete(c) : activeCats.add(c);
    b.setAttribute("aria-pressed", activeCats.has(c));
    renderResults();
  });
  renderResults();
}

/* ---------- explorar ---------- */
function subtabs(active) {
  const items = [["categorias","Por categoría"],["ingredientes","Por ingrediente"],["regiones","Por región"]];
  return `<nav class="subtabs">${items.map(([k,l]) =>
    `<a href="#/explorar/${k}" aria-selected="${k===active}">${l}</a>`).join("")}</nav>`;
}

function viewCategorias() {
  return subtabs("categorias") + CATS.map(c => {
    const rows = ROWS.filter(r => r.cat === c.name);
    const regions = [...new Set(rows.map(r => r.regionSlug))]
      .sort((a,b) => col.compare(byRegion.get(a).name, byRegion.get(b).name));
    const uniq = new Set(rows.map(r => r.foodSlug)).size;
    return `<details class="cat">
      <summary>${c.name} <span class="n">${plural(uniq,"ingrediente","ingredientes")} en ${regions.length} regiones</span></summary>
      <div class="catbody">
        <p class="sub" style="margin:0">${c.desc}</p>
        ${regions.map(rs => `<div class="regblock">
          <h4><a href="#/region/${rs}">${esc(byRegion.get(rs).name)}</a></h4>
          <div class="inline-list">${rows.filter(r => r.regionSlug === rs)
            .sort((a,b) => col.compare(a.food,b.food))
            .map(r => `<a class="pill" href="#/ingrediente/${r.foodSlug}">${esc(r.food)}</a>`).join("")}</div>
        </div>`).join("")}
      </div></details>`;
  }).join("");
}

function viewIngredientes() {
  const groups = new Map();
  for (const [slug, f] of foodList) {
    const l = fold(f.name)[0].toUpperCase();
    if (!groups.has(l)) groups.set(l, []);
    groups.get(l).push([slug, f]);
  }
  return subtabs("ingredientes") +
    `<p class="count">${plural(foodList.length,"ingrediente","ingredientes")}</p>
     <div class="alpha">${[...groups].map(([letter, items]) => `<div class="alpha-group">
       <div class="alpha-letter">${letter}</div>
       <div class="linklist">${items.map(([slug,f]) =>
         `<a href="#/ingrediente/${slug}">${esc(f.name)}</a>`).join("")}</div>
     </div>`).join("")}</div>`;
}

function viewRegiones() {
  return subtabs("regiones") +
    `<p class="count">${plural(regionList.length,"región","regiones")}</p>
     <div class="regiongrid">${regionList.map(([slug,r]) =>
       `<a href="#/region/${slug}"><span>${esc(r.name)}</span><span class="n">${r.rows.length}</span></a>`
     ).join("")}</div>`;
}

/* ---------- fichas ---------- */
// Ingredientes que más regiones comparten con este, de mayor a menor coincidencia.
function companions(slug, regions, max = 5) {
  const shared = new Map(), cats = new Map();
  for (const r of ROWS) {
    if (!regions.has(r.regionSlug)) continue;
    if (!cats.has(r.foodSlug)) { cats.set(r.foodSlug, []); shared.set(r.foodSlug, new Set()); }
    if (!cats.get(r.foodSlug).includes(r.cat)) cats.get(r.foodSlug).push(r.cat);
    shared.get(r.foodSlug).add(r.regionSlug);
  }
  shared.delete(slug);
  return [...shared]
    .sort((a,b) => b[1].size - a[1].size || col.compare(byFood.get(a[0]).name, byFood.get(b[0]).name))
    .slice(0, max)
    .map(([s, set]) => ({
      slug: s,
      name: byFood.get(s).name,
      cats: cats.get(s).sort((x,y) => CAT_ORDER[x] - CAT_ORDER[y]),
      regions: [...set].sort((x,y) => col.compare(byRegion.get(x).name, byRegion.get(y).name))
    }));
}

function viewIngrediente(slug) {
  const f = byFood.get(slug);
  if (!f) return notFound();
  const rows = [...f.rows].sort((a,b) => col.compare(a.region,b.region));
  const regions = new Set(f.rows.map(r => r.regionSlug));
  const mates = companions(slug, regions);
  return `<p class="crumbs"><a href="#/explorar/ingredientes">Ingredientes</a><span>/</span>${esc(f.name)}</p>
    <h1 class="page-title">${esc(f.name)}</h1>
    ${mates.length ? `<div class="group">
      <div class="group-head"><h3>Se usa a menudo con</h3></div>
      <div class="mates">${mates.map(m => `<div class="mate">
        <div class="mate-top">
          <a class="mate-name" href="#/ingrediente/${m.slug}">${esc(m.name)}</a>
          <span class="tags">${m.cats.map(tag).join("")}</span>
        </div>
        <p class="mate-regs">${m.regions.map(rs =>
          `<a href="#/region/${rs}">${esc(byRegion.get(rs).name)}</a>`)
          .join(`<span class="sep"> · </span>`)}</p>
      </div>`).join("")}</div>
    </div>` : ""}
    <div class="group">
      <div class="group-head"><h3>Regiones que lo usan en su cocina</h3>
        <span class="n">${rows.length}</span></div>
      <div class="pairs">${rows.map(r => `<a class="pair" href="#/region/${r.regionSlug}">
        <span class="name">${esc(r.region)}</span>${tag(r.cat)}</a>`).join("")}</div>
    </div>`;
}

function viewRegion(slug) {
  const g = byRegion.get(slug);
  if (!g) return notFound();
  const cats = [...new Set(g.rows.map(r => r.cat))].sort((a,b) => CAT_ORDER[a]-CAT_ORDER[b]);
  return `<p class="crumbs"><a href="#/explorar/regiones">Regiones</a><span>/</span>${esc(g.name)}</p>
    <h1 class="page-title">${esc(g.name)}</h1>
    ${cats.map(c => {
      const items = g.rows.filter(r => r.cat === c).sort((a,b) => col.compare(a.food,b.food));
      return `<div class="group">
        <div class="group-head"><h3>${tag(c)}</h3><span class="n">${items.length}</span></div>
        <div class="inline-list">${items.map(r =>
          `<a class="pill" href="#/ingrediente/${r.foodSlug}">${esc(r.food)}</a>`).join("")}</div>
      </div>`;
    }).join("")}`;
}

function notFound() {
  return `<h1 class="page-title">No encontrado</h1>
    <p class="sub">Esa página no existe. <a href="#/">Volver a la búsqueda</a>.</p>`;
}

/* ---------- ruedas (continente / región / ingrediente) ---------- */
const R0 = 78, R1 = 190, R2 = 320, R3 = 540, VB = 556;
const rad = a => a * Math.PI / 180;
const pt = (r,a) => `${(r*Math.sin(rad(a))).toFixed(2)} ${(-r*Math.cos(rad(a))).toFixed(2)}`;

function sector(r0, r1, a0, a1) {
  const big = (a1 - a0) > 180 ? 1 : 0;
  return `M${pt(r1,a0)}A${r1} ${r1} 0 ${big} 1 ${pt(r1,a1)}`
       + `L${pt(r0,a1)}A${r0} ${r0} 0 ${big} 0 ${pt(r0,a0)}Z`;
}

// Etiqueta radial; se omite si el sector es más estrecho que la altura del texto.
function radialLabel(txt, a0, a1, r0, r1, fs, cls) {
  const a = (a0 + a1) / 2;
  if (rad(a1 - a0) * ((r0 + r1) / 2) < fs * 1.1) return "";
  const room = (r1 - r0) - 12, wide = fs * 0.53;
  let t = txt;
  if (t.length * wide > room) t = t.slice(0, Math.max(2, Math.floor(room / wide) - 1)).trim() + "…";
  const flip = a > 180;
  const tr = `rotate(${(a-90).toFixed(2)}) translate(${flip ? r1 : r0},0)` + (flip ? " rotate(180)" : "");
  return `<text class="${cls}" transform="${tr}" x="6" dy="0.33em" font-size="${fs}">${esc(t)}</text>`;
}

const darkMQ = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : darkMQ.matches;
};
// La rueda vive en el tema de la página: en oscuro baja la luminosidad en vez de invertir el tono.
const hsl = (c, d) => isDark()
  ? `hsl(${c.h} ${c.ds}% ${Math.min(40, c.dl + d * 0.62)}%)`
  : `hsl(${c.h} ${c.s}% ${Math.min(86, c.l + d)}%)`;

function wheelSVG(cat) {
  const rows = ROWS.filter(r => r.cat === cat.name);
  const step = 360 / rows.length;
  const buckets = new Map();
  for (const r of rows) {
    if (!buckets.has(r.regionSlug)) buckets.set(r.regionSlug, []);
    buckets.get(r.regionSlug).push(r);
  }
  let a = 0;
  const arcs = [], regs = [], foods = [];

  for (const cont of CONTINENTES) {
    const present = cont.regions.filter(rs => buckets.has(rs));
    if (!present.length) continue;
    const contStart = a;
    present.forEach((rs, i) => {
      const items = buckets.get(rs).sort((x,y) => col.compare(x.food, y.food));
      const regStart = a, regEnd = a + items.length * step;
      const alt = i % 2;
      items.forEach((r, j) => {
        const f0 = a, f1 = a + step;
        foods.push(`<a href="#/ingrediente/${r.foodSlug}"><title>${esc(r.food)} · ${esc(r.region)}</title>`
          + `<path d="${sector(R2, R3, f0, f1)}" fill="${hsl(cont, 20 + alt*3 + (j%2?2:0))}"/></a>`
          + radialLabel(r.food, f0, f1, R2, R3, 8.6, "lbl-food"));
        a = f1;
      });
      regs.push(`<a href="#/region/${rs}"><title>${esc(buckets.get(rs)[0].region)}</title>`
        + `<path d="${sector(R1, R2, regStart, regEnd)}" fill="${hsl(cont, 11 + alt*4)}"/></a>`
        + radialLabel(buckets.get(rs)[0].region, regStart, regEnd, R1, R2, 10, "lbl-reg"));
    });
    arcs.push(`<path d="${sector(R0, R1, contStart, a)}" fill="${hsl(cont, 0)}"/>`
      + radialLabel(cont.name, contStart, a, R0, R1, 12.5, "lbl-cont"));
  }

  return `<svg viewBox="${-VB} ${-VB} ${VB*2} ${VB*2}" width="${VB*2}" height="${VB*2}"
      role="img" aria-label="Rueda de ${esc(cat.name)}: continente, región e ingrediente">
    <g class="ring-food">${foods.join("")}</g>
    <g class="ring-reg">${regs.join("")}</g>
    <g class="ring-cont">${arcs.join("")}</g>
    <circle class="hub" r="${R0}"/>
    <text class="lbl-hub" y="-4" text-anchor="middle" font-size="21">${esc(cat.name)}</text>
    <text class="lbl-hub-n" y="18" text-anchor="middle" font-size="11">${rows.length} en la rueda</text>
  </svg>`;
}

function viewRuedas(slug) {
  const cat = CATS.find(c => c.slug === slug) || CATS[0];
  return `<nav class="subtabs">${CATS.map(c =>
      `<a href="#/ruedas/${c.slug}" aria-selected="${c === cat}">${c.name}</a>`).join("")}</nav>
    <h1 class="page-title">${cat.name}</h1>
    <p class="sub">${cat.desc} De dentro afuera: continente, región e ingrediente. Toca cualquier gajo para abrir su ficha.</p>
    <div class="bleed"><div class="wheelbox">${wheelSVG(cat)}</div>
      <p class="wheel-hint">Desplaza la rueda en horizontal si no te cabe entera.</p></div>`;
}

/* ---------- enrutado ---------- */
function route() {
  const parts = (location.hash.replace(/^#\/?/, "").split("/")).filter(Boolean);
  const view = document.getElementById("view");
  let onSearch = false, html, heading = null;

  if (parts[0] === "explorar") {
    const sub = {ingredientes:["Ingredientes", viewIngredientes],
                 regiones:["Regiones", viewRegiones]}[parts[1]] || ["Categorías", viewCategorias];
    heading = sub[0]; html = sub[1]();
  } else if (parts[0] === "ruedas") {
    heading = "Ruedas"; html = viewRuedas(parts[1]);
  } else if (parts[0] === "ingrediente") {
    html = viewIngrediente(parts[1]);
  } else if (parts[0] === "region") {
    html = viewRegion(parts[1]);
  } else {
    html = viewSearch(); onSearch = true;
  }

  view.innerHTML = html;
  if (onSearch) wireSearch();

  const section = onSearch ? "buscar" : parts[0] === "ruedas" ? "ruedas" : "explorar";
  for (const s of ["buscar","explorar","ruedas"])
    document.getElementById("tab-" + s).setAttribute("aria-selected", s === section);
  const name = heading || view.querySelector(".page-title")?.textContent.trim();
  document.title = onSearch || !name ? "Salt Fat Acid Heat" : name + " · Salt Fat Acid Heat";
}

/* ---------- tema claro / oscuro ---------- */
// "sistema" devuelve el tema con el que llegó la página; los otros dos lo fijan.
const HOST_THEME = document.documentElement.dataset.theme || null;
const MODES = {
  system: {label:"Tema: el del sistema", icon:'<circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 5a7 7 0 0 1 0 14z" fill="currentColor" stroke="none"/>'},
  light:  {label:"Tema: claro", icon:'<circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>'},
  dark:   {label:"Tema: oscuro", icon:'<path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2z"/>'}
};
const ORDER = ["system","light","dark"];

let mode = (() => { try { return localStorage.getItem("tema") || "system"; } catch { return "system"; } })();

function applyTheme() {
  const root = document.documentElement;
  if (mode === "system") {
    HOST_THEME ? root.dataset.theme = HOST_THEME : delete root.dataset.theme;
  } else {
    root.dataset.theme = mode;
  }
  const btn = document.getElementById("theme");
  btn.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${MODES[mode].icon}</svg>`;
  btn.setAttribute("aria-label", MODES[mode].label);
  btn.title = MODES[mode].label + " (pulsa para cambiar)";
}

document.getElementById("theme").addEventListener("click", () => {
  mode = ORDER[(ORDER.indexOf(mode) + 1) % ORDER.length];
  try { localStorage.setItem("tema", mode); } catch {}
  applyTheme();
});
applyTheme();

const repaintWheel = () => { if (location.hash.startsWith("#/ruedas")) route(); };
darkMQ.addEventListener("change", repaintWheel);
new MutationObserver(repaintWheel)
  .observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});

addEventListener("hashchange", () => { route(); scrollTo(0,0); });
route();
</script>
